<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Registrations | Court 822</title>
<style>:root{color-scheme:dark}body{margin:0;background:#101411;color:#f2efe4;font:16px system-ui,Arial,sans-serif}main{max-width:900px;margin:auto;padding:32px 18px}h1{color:#d5b773}a{color:#d5b773}.muted{color:#b7b9b2}.card{border:1px solid #4a4b40;border-radius:14px;padding:20px;margin:14px 0;background:#1b211d}.status{display:inline-block;padding:5px 10px;border:1px solid #797c65;border-radius:99px;font-size:13px}button{background:#c9a85c;color:#161713;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#notice{margin-top:16px;white-space:pre-wrap}dl{display:grid;grid-template-columns:130px 1fr;gap:8px}dt{color:#b7b9b2}dd{margin:0}@media(max-width:520px){dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:10px}}</style></head>
<body><main><a href="tournament.html">Back to tournaments</a><h1>My Registrations</h1><p class="muted">View your teams, payment status and check-in availability. Team QR credentials appear only after verified payment and secure delivery are enabled.</p><button id="refresh" type="button">Refresh registrations</button><div id="notice" role="status" aria-live="polite"></div><section id="results"></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="supabase-client.js"></script>
<script>
'use strict';
const notice=document.getElementById('notice');const results=document.getElementById('results');const refresh=document.getElementById('refresh');
function label(status){return ({draft:'Registration saved',pending_payment:'Awaiting payment',pending_verification:'Payment awaiting verification',confirmed:'Confirmed',rejected:'Rejected',cancelled:'Cancelled',expired:'Expired'})[status]||status||'Unknown';}
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e;}
async function load(){refresh.disabled=true;results.replaceChildren();notice.textContent='Loading...';try{if(!window.courtDb)throw Error('Supabase configuration is unavailable.');const {data:userResult,error:userError}=await courtDb.auth.getUser();if(userError)throw userError;if(!userResult.user)throw Error('Sign in on the tournament page first.');const {data,error}=await courtDb.rpc('court822_my_registration_dashboard');if(error)throw error;if(!data?.success||!Array.isArray(data.registrations))throw Error('Invalid registration response.');notice.textContent=data.registrations.length?'':'No submitted checkouts found. Saved drafts do not appear here.';for(const r of data.registrations){const card=el('article',undefined,'card');card.append(el('h2',r.category||'Team'),el('p',r.tournament||'Tournament','muted'),el('span',label(r.checkout_status),'status'));const dl=el('dl');for(const [k,v] of [['Player 1',r.player1],['Player 2',r.player2],['Checkout total',Number(r.total_amount||0).toLocaleString('en-PH',{style:'currency',currency:'PHP'})],['Payment verified',r.payment_verified?'Yes':'No'],['Checked in',r.checked_in?'Yes':'No']]){dl.append(el('dt',k),el('dd',v??'—'));}card.append(dl);card.append(el('p',r.qr_available?'QR record issued. Secure QR retrieval is not yet enabled.':'QR not available until owner verifies payment.','muted'));results.append(card);}}catch(e){notice.textContent=e.message||'Unable to load registrations.';}finally{refresh.disabled=false;}}
refresh.addEventListener('click',load);load();
</script></body></html>
